# Shared settings imported by both services (spring.config.import).
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docassist}
    username: ${SPRING_DATASOURCE_USERNAME:docassist}
    password: ${SPRING_DATASOURCE_PASSWORD:docassist}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

docassist:
  tenant: ${DOCASSIST_TENANT:acme}
  # Tenant glossary: words found across the whole corpus (the company's own name) that carry no matching signal.
  low-information-terms: [halcyon, halcyon robotics]
  llm:
    provider: ${DOCASSIST_LLM_PROVIDER:auto}           # auto | anthropic | mock
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: https://api.anthropic.com
    model: ${DOCASSIST_LLM_MODEL:claude-sonnet-5-5}
    fast-model: ${DOCASSIST_LLM_FAST_MODEL:claude-haiku-5-5}
    max-tokens: 8192
    timeout-seconds: 60
    max-retries: 2
  embeddings:
    provider: ${DOCASSIST_EMBEDDINGS_PROVIDER:local}  # local | voyage
    voyage-api-key: ${VOYAGE_API_KEY:}
    voyage-model: voyage-3.5-lite
  retrieval:
    dense-k: 50
    lexical-k: 50
    top-k: 8
    max-context-tokens: 6000
    retrieval-cache-ttl-seconds: 600
    group-cache-ttl-seconds: 60
  prices:                                            # USD per million tokens; replace with contracted rates
    claude-sonnet-5-5: { input: 2.0, output: 10.0, cache-read-multiplier: 0.05 }
    claude-haiku-5-5: { input: 0.10, output: 0.50, cache-read-multiplier: 0.10 }
