name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ingestion:
    name: ingestion plane (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Unit tests
        run: mvn -B -q test
        working-directory: ingestion

  query:
    name: query plane (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
        working-directory: query
      - name: Graph, policy and cross-plane parity tests
        run: python -m pytest -q
        working-directory: query

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund
        working-directory: ui
      - name: Type-check and build
        run: npm run build
        working-directory: ui

  evals:
    # Full stack in mock mode (no API key): proves permissions, guardrails and the eval gates on every PR.
    # Add ANTHROPIC_API_KEY as a secret and set DOCASSIST_LLM_PROVIDER=anthropic in a nightly job to gate the real model.
    needs: [ingestion, query, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scorer self-test
        run: python3 evals/run_evals.py --self-test
      - name: Start stack
        run: docker compose up -d --build --wait postgres redis kafka worker query
      - name: Wait for the initial ingest
        run: |
          # The connector scans every 5 s; give the pipeline time to index the corpus.
          for i in $(seq 1 30); do
            n=$(docker compose exec -T postgres psql -U docassist -tAc "select count(*) from document" || echo 0)
            [ "$n" -ge 14 ] && break
            sleep 2
          done
      - name: Run golden-set evals
        run: python3 evals/run_evals.py --api http://localhost:8080 --golden evals/golden.jsonl
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: eval-report, path: evals/reports/ }
      - name: Logs on failure
        if: failure()
        run: docker compose logs worker query | tail -300
